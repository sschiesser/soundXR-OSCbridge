[project]
name = "soundxr-osc-bridge"
version = "1.0.0"
description = "Auto-discovering OSC mapper for Yamaha Sound xR Image"
requires-python = ">=3.10"
dependencies = ["python-osc>=1.8", "PySide6>=6.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["soundxr_bridge*"]
