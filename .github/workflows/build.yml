name: build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SoundxR-OSC-Bridge-windows
          - os: macos-latest            # Apple silicon runner
            artifact: SoundxR-OSC-Bridge-macos-arm64
          - os: macos-15-intel          # Intel runner (macos-13 was retired Dec 2025)
            artifact: SoundxR-OSC-Bridge-macos-x86_64
          - os: ubuntu-latest
            artifact: SoundxR-OSC-Bridge-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Check Qt actually loads
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import PySide6, pythonosc; from PySide6.QtWidgets import QApplication; QApplication([]); print('Qt ok', PySide6.__version__)"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Build
        run: python -m PyInstaller packaging/soundxr_bridge.spec --noconfirm --clean

      - name: Smoke test the binary (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/SoundxR-OSC-Bridge/SoundxR-OSC-Bridge --help

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -qry ../${{ matrix.artifact }}.zip SoundxR-OSC-Bridge.app
          cd ..

      - name: Package Windows / Linux app
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cd dist
          7z a -tzip ../${{ matrix.artifact }}.zip SoundxR-OSC-Bridge >/dev/null \
            || zip -qry ../${{ matrix.artifact }}.zip SoundxR-OSC-Bridge
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
